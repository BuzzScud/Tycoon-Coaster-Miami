<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RollerCoaster Tycoon</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #8a867a; }
  #app { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .rct { font-family: "Geneva", "Verdana", "Tahoma", sans-serif; font-size: 11px; line-height: 13px; color: #111; }
  .rct b { font-weight: 700; }
  #toolbar { position: absolute; left: 0; top: 0; display: flex; gap: 10px; padding: 2px; }
  #toolbar .grp { display: flex; }
  .btn { width: 30px; height: 30px; background: #a9a497; border: 1px solid; border-color: #e6e2d8 #4d4a43 #4d4a43 #e6e2d8; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn svg { width: 18px; height: 18px; display: block; }
  .grp.sys .btn { background: #a7a59e; } .grp.build .btn { background: #9faab0; } .grp.manage .btn { background: #b5a98f; }
  .btn.down { border-color: #4d4a43 #e6e2d8 #e6e2d8 #4d4a43; background: #8c887c; }
  .btn:active { border-color: #4d4a43 #e6e2d8 #e6e2d8 #4d4a43; }
  #windows { position: absolute; inset: 0; pointer-events: none; } #windows > * { pointer-events: auto; }
  .win { position: absolute; background: #c9c4b6; border: 1px solid; border-color: #ece8de #58544b #58544b #ece8de; box-shadow: 1px 1px 0 #2a2822; min-width: 200px; max-width: 96vw; }
  .win .title { height: 15px; display: flex; align-items: center; color: #fff; font-weight: 700; text-shadow: 1px 1px 0 #333; padding-left: 2px; gap: 4px; cursor: move; user-select: none; }
  .win .title .x { width: 11px; height: 11px; border: 1px solid; border-color: #fff #555 #555 #fff; background: #bbb; color: #222; font-size: 9px; line-height: 9px; text-align: center; text-shadow: none; font-weight: 700; cursor: pointer; }
  .win .tabsrow { display: flex; gap: 1px; padding: 2px 3px 0; }
  .win .tabsrow i { width: 24px; height: 18px; background: #b9b4a6; border: 1px solid; border-color: #e6e2d8 #58544b #58544b #e6e2d8; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .win .tabsrow i.on { background: #d2cdbf; border-bottom-color: #d2cdbf; }
  .win .tabsrow i svg { width: 14px; height: 14px; }
  .win .body { background: #d2cdbf; margin: 0 3px 3px; border: 1px solid; border-color: #58544b #ece8de #ece8de #58544b; padding: 5px 6px; max-height: calc(100vh - 120px); overflow: auto; }
  .win.ride .title { background: #c08a3e; } .win.ride { background: #c7a56a; }
  .win.guest .title { background: #5f9a44; } .win.guest { background: #a9bd90; }
  .win.build .title { background: #8f7a53; } .win.build { background: #bba77f; }
  .win.land .title { background: #6b7a3a; } .win.land { background: #a9b07a; }
  .win.path .title { background: #6f6a64; } .win.path { background: #b3ada3; }
  .win.scenery .title { background: #3f7d3f; } .win.scenery { background: #9bb489; }
  .win.newride .title { background: #9c3d2e; } .win.newride { background: #c99a8c; }
  .win.finance .title { background: #4a4a4a; } .win.finance { background: #a8a8a8; }
  .win.park .title { background: #3a7d6b; } .win.park { background: #9ab8ae; }
  .win.staff .title { background: #2e5aa5; } .win.staff { background: #93a6c9; }
  .win.rides .title { background: #9c3d2e; } .win.rides { background: #c99a8c; }
  .win.guests .title { background: #5f9a44; } .win.guests { background: #a9bd90; }
  .win.options .title, .win.save .title, .win.news .title { background: #6b6b6b; } .win.options, .win.save, .win.news { background: #b0b0b0; }
  .win .body svg, #readout svg, #news svg { width: 14px; height: 14px; vertical-align: -3px; }
  .stat { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; margin: 1px 0; align-items: center; }
  .stat b { font-weight: 700; } .rating-hi { color: #0b5e1f; } .rating-med { color: #6b4d00; } .good { color: #0b5e1f; } .bad { color: #a01515; } .neg { color: #a01515; }
  .bar { height: 9px; border: 1px solid #58544b; background: #fff; margin: 2px 0 3px; position: relative; } .bar i { position: absolute; left: 0; top: 0; bottom: 0; }
  .thought { display: flex; gap: 5px; align-items: flex-start; margin: 2px 0; } .thought svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
  .kbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; padding: 0 6px; background: #c9c4b6; border: 1px solid; border-color: #ece8de #58544b #58544b #ece8de; margin: 1px; cursor: pointer; user-select: none; white-space: nowrap; gap: 4px; }
  .kbtn.on { border-color: #58544b #ece8de #ece8de #58544b; background: #aaa597; } .kbtn:active { border-color: #58544b #ece8de #ece8de #58544b; }
  .kbtn svg { width: 16px; height: 16px; } .kbtn.sw { min-width: 22px; padding: 0 3px; } .kbtn.sw i { display: block; width: 12px; height: 12px; border: 1px solid #333; }
  .kbtn.item { height: auto; flex-direction: column; align-items: flex-start; padding: 3px 6px; min-width: 120px; } .kbtn.item em { font-style: normal; color: #444; font-size: 10px; }
  .kbtn.big { font-weight: 700; height: 28px; padding: 0 14px; }
  .sect { margin-bottom: 5px; } .sect.center { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; } .sect .lab, .lab { font-weight: 700; margin: 3px 0 1px; }
  .sp { height: 5px; } .cost { text-align: center; font-weight: 700; margin-top: 4px; }
  .hint { color: #333; margin-top: 4px; white-space: normal; line-height: 13px; } .hint.warn { color: #a01515; }
  .grid { display: flex; flex-wrap: wrap; gap: 2px; }
  .list { max-height: 260px; overflow: auto; background: #e4dfd2; border: 1px solid; border-color: #58544b #ece8de #ece8de #58544b; } .list.tall { max-height: 420px; }
  .row { padding: 3px 5px; border-bottom: 1px solid #c3bdb0; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; } .row:hover { background: #ece8de; } .row.on { background: #cfe3c0; } .row.dim { opacity: .55; cursor: default; }
  .row b { font-weight: 700; } .row small { grid-column: 1 / 3; color: #333; white-space: normal; } .row .cost { font-weight: 400; margin: 0; }
  .tbl { border-collapse: collapse; width: 100%; } .tbl th, .tbl td { text-align: right; padding: 1px 4px; border-bottom: 1px solid #b9b4a6; } .tbl td:first-child { text-align: left; } .tbl tr.tot td { font-weight: 700; border-top: 2px solid #58544b; }
  .bars { display: flex; align-items: flex-end; gap: 1px; height: 42px; background: #e4dfd2; border: 1px solid #58544b; padding: 1px; } .bars i { flex: 1; background: #2a9d2a; min-width: 2px; }
  input { font: inherit; padding: 1px 3px; border: 1px solid; border-color: #58544b #ece8de #ece8de #58544b; background: #fff; }
  #readout { position: absolute; left: 10px; bottom: 10px; width: 236px; background: #9c9a93; border: 1px solid; border-color: #ece8de #58544b #58544b #ece8de; box-shadow: 1px 1px 0 #2a2822; padding: 4px 6px; }
  #readout .money { font-weight: 700; font-size: 12px; cursor: pointer; } #readout .money.neg { color: #a01515; } #readout span[data-act] { cursor: pointer; }
  #readout .prbar { height: 7px; border: 1px solid #333; background: linear-gradient(90deg, #d33 0 35%, #e9c21f 35% 60%, #2a9d2a 60%); position: relative; margin: 3px 0; cursor: pointer; } #readout .prbar i { position: absolute; top: -3px; width: 2px; height: 11px; background: #000; }
  #readout .wx { display: inline-flex; align-items: center; gap: 3px; } #readout .wx svg { width: 13px; height: 13px; }
  #news { position: absolute; left: 260px; bottom: 10px; max-width: 560px; background: #9c9a93; border: 1px solid; border-color: #ece8de #58544b #58544b #ece8de; box-shadow: 1px 1px 0 #2a2822; padding: 4px 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #news .ic svg { width: 14px; height: 14px; display: block; }
  #toast { position: absolute; background: #ffe9a6; border: 1px solid #7a5d00; padding: 4px 8px; max-width: 240px; display: none; z-index: 9999; pointer-events: none; box-shadow: 1px 1px 0 #2a2822; }
  #toast.on { display: block; }
  #title { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3b6d2b, #16220f 70%); display: flex; align-items: center; justify-content: center; }
  .tcard { background: #c9c4b6; border: 1px solid; border-color: #ece8de #58544b #58544b #ece8de; box-shadow: 2px 2px 0 #2a2822; padding: 14px 18px; width: 560px; max-width: 94vw; }
  .logo { text-align: center; margin-bottom: 10px; } .logo span { display: block; font-weight: 900; font-size: 34px; line-height: 34px; color: #c0392b; text-shadow: 2px 2px 0 #7a1d12, 3px 3px 0 #2a2822; letter-spacing: 1px; } .logo span + span { color: #e9c21f; text-shadow: 2px 2px 0 #7a5d00, 3px 3px 0 #2a2822; } .logo small { display: block; margin-top: 6px; color: #333; font-size: 12px; }
  .trow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 6px; margin: 4px 0; } .trow label { font-weight: 700; } .trow input { width: 100%; }
  .thint { color: #333; margin: 8px 0; line-height: 14px; } .tbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; } .tfoot { margin-top: 12px; color: #333; line-height: 14px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ui">
    <div id="windows"></div>
    <div id="toolbar" class="rct"></div>
    <div id="readout" class="rct"></div>
    <div id="news" class="rct" style="display:none"></div>
    <div id="toast" class="rct"></div>
  </div>
  <div id="title"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
